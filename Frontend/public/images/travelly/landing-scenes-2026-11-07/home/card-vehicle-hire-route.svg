<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" role="img" aria-label="">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6db9f7"/><stop offset=".55" stop-color="#9fd0fa"/><stop offset="1" stop-color="#bfe0fb"/>
    </linearGradient>
    <radialGradient id="glow" cx=".62" cy=".38" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6e5f8"/>
    </linearGradient>
    <linearGradient id="tileSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb1dc"/><stop offset="1" stop-color="#5d86bd"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe0f6"/><stop offset="1" stop-color="#b6cfee"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f93dd"/><stop offset=".5" stop-color="#2f6fba"/><stop offset="1" stop-color="#1c4a8c"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a9fe6"/><stop offset="1" stop-color="#2c68b3"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/><stop offset=".6" stop-color="#bcd8f6"/><stop offset="1" stop-color="#8fb9e8"/>
    </linearGradient>
    <linearGradient id="bumper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26548f"/><stop offset="1" stop-color="#14325f"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#eaf4ff"/><stop offset="1" stop-color="#b7d3f2"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pin" cx=".35" cy=".28" r=".85">
      <stop offset="0" stop-color="#ff6a62"/><stop offset=".35" stop-color="#ff1a14"/><stop offset="1" stop-color="#c70a08"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8dc6f6" stop-opacity="0"/><stop offset=".25" stop-color="#8dc6f6"/><stop offset="1" stop-color="#bfe0fb"/>
    </linearGradient>
        <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="804" x2="0" y2="960"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="reflectMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1536" height="1024"><rect x="0" y="780" width="1536" height="244" fill="url(#fade)"/></mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft2" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#2a5a96" flood-opacity=".35"/></filter>

    <g id="car">
      <!-- lower body + bumper -->
      <rect x="835" y="595" width="530" height="190" rx="64" fill="url(#body)"/>
      <rect x="868" y="722" width="464" height="66" rx="30" fill="url(#bumper)"/>
      <!-- wheels -->
      <rect x="880" y="758" width="96" height="46" rx="20" fill="#0f2548"/>
      <rect x="1224" y="758" width="96" height="46" rx="20" fill="#0f2548"/>
      <!-- cabin -->
      <path d="M936 604 L990 480 Q996 466 1012 466 L1188 466 Q1204 466 1210 480 L1264 604 Z" fill="url(#roof)"/>
      <path d="M966 596 L1011 497 Q1015 488 1026 488 L1174 488 Q1185 488 1189 497 L1234 596 Z" fill="url(#glass)"/>
      <path d="M1030 488 L1174 488 L1130 596 L1085 596 Z" fill="#fff" opacity=".22"/>
      <!-- mirrors -->
      <rect x="880" y="566" width="62" height="34" rx="16" fill="#2c68b3"/>
      <rect x="1258" y="566" width="62" height="34" rx="16" fill="#2c68b3"/>
      <!-- hood highlight -->
      <path d="M880 640 Q1100 600 1320 640 L1320 654 Q1100 622 880 654 Z" fill="#fff" opacity=".28"/>
      <!-- headlights -->
      <ellipse cx="925" cy="676" rx="62" ry="44" fill="url(#lampGlow)"/>
      <ellipse cx="1275" cy="676" rx="62" ry="44" fill="url(#lampGlow)"/>
      <rect x="880" y="650" width="92" height="52" rx="26" fill="url(#lamp)"/>
      <rect x="1228" y="650" width="92" height="52" rx="26" fill="url(#lamp)"/>
      <!-- grille + red plate -->
      <rect x="1000" y="654" width="200" height="30" rx="15" fill="#173b71"/>
      <rect x="1012" y="662" width="176" height="6" rx="3" fill="#6fa6e6" opacity=".7"/>
      <rect x="1040" y="728" width="120" height="40" rx="12" fill="#f4f8fe"/>
      <rect x="1040" y="728" width="120" height="14" rx="7" fill="#ff1a14"/>
      <!-- edge light -->
      <path d="M860 640 Q850 600 890 596" fill="none" stroke="#9cc8f5" stroke-width="5" stroke-linecap="round" opacity=".7"/>
    </g>
  </defs>

  <rect width="1536" height="1024" fill="url(#sky)"/>
  <rect width="1536" height="1024" fill="url(#glow)"/>
  <!-- floor sheen -->
  <rect y="800" width="1536" height="224" fill="url(#floor)" opacity=".65"/>

  <g transform="translate(0 50)">
  <!-- map tile -->
  <g transform="rotate(-5 420 470)" filter="url(#drop)">
    <rect x="96" y="196" width="720" height="556" rx="64" fill="url(#tileSide)" transform="translate(0 22)"/>
    <rect x="96" y="196" width="720" height="556" rx="64" fill="url(#tile)"/>
    <!-- blocks -->
    <rect x="140" y="240" width="190" height="130" rx="26" fill="url(#block)"/>
    <rect x="380" y="240" width="150" height="130" rx="26" fill="url(#block)"/>
    <rect x="590" y="240" width="180" height="130" rx="26" fill="url(#block)"/>
    <rect x="140" y="420" width="130" height="270" rx="26" fill="url(#block)"/>
    <rect x="320" y="420" width="210" height="110" rx="26" fill="url(#block)"/>
    <rect x="320" y="580" width="210" height="110" rx="26" fill="url(#block)"/>
    <rect x="590" y="420" width="180" height="270" rx="26" fill="url(#block)"/>
    <!-- route: navy dashes, round caps -->
    <path d="M190 660 C190 540 330 560 340 500 C350 440 230 420 330 390 C430 365 470 410 540 395 C640 375 590 330 690 300" fill="none" stroke="#0d2a63" stroke-width="16" stroke-linecap="round" stroke-dasharray="1 38"/>
    <circle cx="190" cy="662" r="26" fill="#fff"/><circle cx="190" cy="662" r="14" fill="#2f6fba"/>
    <!-- pin ring + shadow -->
      </g>

  <!-- red pin -->
    <g transform="translate(592 368) scale(.84) translate(-688 -462)"><ellipse cx="688" cy="464" rx="74" ry="22" fill="#ff1a14" opacity=".2"/><ellipse cx="688" cy="464" rx="42" ry="12" fill="#ff1a14" opacity=".32"/></g>
  <g filter="url(#drop)" transform="translate(592 368) scale(.84) translate(-688 -462)">
    <path d="M640 120 C560 120 504 178 504 250 C504 340 600 400 640 470 C680 400 776 340 776 250 C776 178 720 120 640 120 Z" fill="url(#pin)" transform="translate(48 -6)"/>
    <circle cx="688" cy="244" r="46" fill="#fff6f4"/>
    <circle cx="688" cy="244" r="46" fill="none" stroke="#c70a08" stroke-width="6" opacity=".25"/>
    <path d="M590 190 C610 150 660 132 704 138" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".55"/>
  </g>

  <!-- floor shadow + reflection -->
  <ellipse cx="1100" cy="800" rx="330" ry="30" fill="#2a5a96" opacity=".28" filter="url(#soft)"/>
  <g mask="url(#reflectMask)" opacity=".9">
    <use href="#car" transform="translate(0 1608) scale(1 -1)"/>
  </g>
  <g filter="url(#drop)"><use href="#car"/></g>

  </g>
  <!-- sparkle accents -->
  <circle cx="1390" cy="250" r="14" fill="#fff" opacity=".55"/>
  <circle cx="1330" cy="330" r="7" fill="#fff" opacity=".5"/>
  <path d="M1000 330 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z" fill="#fff" opacity=".6"/>
</svg>
