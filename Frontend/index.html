<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="One Travelly account for your journeys across Sri Lanka." />
    <title>Travelly — Your journey starts here</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      /* First paint before the app loads: never blue. Neutral light, or the sunset photo on the sign-in pages. */
      html, body { margin: 0; background: #f4f6f9; }
      html.auth-boot, html.auth-boot body { background: #f6dcc8 url('/images/travelly/heroes/auth-sunset-coast.jpg') center / cover no-repeat; }
    </style>
    <script>
      if (/^\/(login|register|forgot-password|check-email|verify-email|reset-password|google-complete)\/?$/.test(location.pathname)) document.documentElement.classList.add('auth-boot')
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
